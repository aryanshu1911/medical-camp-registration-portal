{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block content %}

<h1>Admin Login</h1>

{% if error %}
    <p><strong>{{ error }}</strong></p>
{% endif %}

<form method="post" action="/admin/login">

    <div>
        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            required
        >
    </div>

    <div>
        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >
    </div>

    <button type="submit">Login</button>

</form>

{% endblock %}
